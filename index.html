<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My FitBit • Fitness Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <h1>My FitBit</h1>
  <p>Personalized Strength & Fat Loss</p>
  <button onclick="switchUser()" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;" title="Switch User">
    <svg class="icon" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
      <circle cx="9" cy="7" r="4" />
      <path d="M3 21v-1a6 6 0 0 1 12 0v1" />
      <circle cx="17" cy="8" r="3" />
    </svg>
  </button>
</header>

<div class="container">

  <!-- HERO DASHBOARD -->
  <div class="hero" style="background: linear-gradient(135deg, rgba(50,215,75,0.8), rgba(10,132,255,0.6)), url('assets/images/hero.jpg'); background-size: cover; background-position: center;">
    <div class="hero-stats">
      <div class="stat">
        <span class="stat-number" id="user-weight">78</span>
        <span class="stat-label">kg</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="user-height">5'4"</span>
        <span class="stat-label">height</span>
      </div>
    </div>
    <h2>Welcome Back, <span class="user-name">Kajol</span></h2>
    <p>Ready for today's workout?</p>
  </div>

  <!-- TODAY'S WORKOUT -->
  <div class="card today-card">
    <div class="today-header">
      <h2>Today's Focus</h2>
      <span class="today-date" id="today-date"></span>
    </div>
    <div class="today-workout" id="today-workout">
      <!-- Loaded dynamically from JSON -->
    </div>
  </div>

  <!-- WORKOUT TYPES -->
  <div class="card">
    <h2>Workout Library</h2>
    <div class="workout-grid" id="workout-library">
      <!-- Loaded dynamically from JSON -->
    </div>
  </div>

  <!-- QUICK ACCESS -->
  <div class="card">
    <h2>Quick Access</h2>
    <div class="quick-links">
      <a href="nutrition.html" class="quick-link">
        <span class="quick-icon">🥗</span>
        <span>Nutrition Guide</span>
      </a>
      <a href="schedule.html" class="quick-link">
        <span class="quick-icon">📅</span>
        <span>Weekly Plan</span>
      </a>
      <a href="faq.html" class="quick-link">
        <span class="quick-icon">💡</span>
        <span>Tips & FAQ</span>
      </a>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html" class="active">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M3 11L12 3l9 8" />
      <path d="M5 10v10h14V10" />
    </svg>
    <span>Home</span>
  </a>
  <a href="schedule.html">
    <svg class="icon" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="3" />
      <path d="M16 2v4M8 2v4M3 10h18" />
    </svg>
    <span>Plan</span>
  </a>
  <a href="workout.html?id=lower-body">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M4 12h16" />
      <path d="M2 9v6M22 9v6" />
      <path d="M7 9v6M17 9v6" />
    </svg>
    <span>Workout</span>
  </a>
  <a href="nutrition.html">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 7c4-3 8 1 8 6s-4 8-8 8-8-3-8-8 4-9 8-6z" />
      <path d="M12 7c0-2 1-3 3-4" />
    </svg>
    <span>Fuel</span>
  </a>
  <a href="faq.html">
    <svg class="icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <circle cx="12" cy="8" r="1" />
    </svg>
    <span>Info</span>
  </a>
</nav>

<script src="js/app.js"></script>
</body>
</html>
