<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout • My FitBit</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <a href="index.html" style="position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none;" title="Home">
    <svg class="icon" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
      <path d="M3 11L12 3l9 8" />
      <path d="M5 10v10h14V10" />
    </svg>
  </a>
  <h1 id="workout-title">Workout</h1>
  <p id="workout-subtitle"></p>
</header>

<div class="container">

  <div class="hero" id="workout-hero">
    <div class="workout-progress">
      <svg class="workout-ring" viewBox="0 0 60 60">
        <circle class="bg" cx="30" cy="30" r="25"></circle>
        <circle class="progress" cx="30" cy="30" r="25" id="workout-progress-ring"></circle>
      </svg>
      <div class="progress-text" id="workout-progress-text">0%</div>
    </div>
    <p id="hero-desc" style="font-size: 1rem; margin: 0 0 4px;">Loading...</p>
    <p id="hero-duration" style="font-size: 0.85rem; margin: 0;">Please wait</p>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M3 11L12 3l9 8" />
      <path d="M5 10v10h14V10" />
    </svg>
    <span>Home</span>
  </a>
  <a href="schedule.html">
    <svg class="icon" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="3" />
      <path d="M16 2v4M8 2v4M3 10h18" />
    </svg>
    <span>Plan</span>
  </a>
  <a href="#" class="active">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M4 12h16" />
      <path d="M2 9v6M22 9v6" />
      <path d="M7 9v6M17 9v6" />
    </svg>
    <span>Workout</span>
  </a>
  <a href="nutrition.html">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 7c4-3 8 1 8 6s-4 8-8 8-8-3-8-8 4-9 8-6z" />
      <path d="M12 7c0-2 1-3 3-4" />
    </svg>
    <span>Fuel</span>
  </a>
  <a href="faq.html">
    <svg class="icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <circle cx="12" cy="8" r="1" />
    </svg>
    <span>Info</span>
  </a>
</nav>

<script src="js/app.js"></script>
<script>
let workoutInitialized = false;

function initWorkoutPage() {
  if (workoutInitialized) return;
  
  const params = new URLSearchParams(window.location.search);
  const workoutId = params.get('id');
  
  if (!workoutId) {
    window.location.href = 'index.html';
    return;
  }
  
  if (!workoutData || !workoutData.workouts || !workoutData.workouts[workoutId]) {
    console.log('Waiting for data to load...');
    setTimeout(initWorkoutPage, 200);
    return;
  }
  
  workoutInitialized = true;
  const workout = workoutData.workouts[workoutId];
  const container = document.querySelector('.container');
  const hero = container.querySelector('.hero');
  
  // Update header
  document.getElementById('workout-title').textContent = workout.title;
  document.getElementById('hero-desc').textContent = workout.description;
  document.getElementById('hero-duration').textContent = workout.duration;
  
  // Set hero background
  const backgrounds = {
    'lower-body': "linear-gradient(135deg, rgba(255,69,58,0.8), rgba(255,159,10,0.6)), url('assets/images/lower.jpg')",
    'upper-body': "linear-gradient(135deg, rgba(10,132,255,0.8), rgba(50,215,75,0.6)), url('assets/images/upper.jpg')",
    'cardio-abs': "linear-gradient(135deg, rgba(255,159,10,0.8), rgba(255,69,58,0.6)), url('assets/images/cardio.jpg')",
    'legs-glutes': "linear-gradient(135deg, rgba(255,69,58,0.8), rgba(255,159,10,0.6)), url('assets/images/lower.jpg')",
    'full-body': "linear-gradient(135deg, rgba(50,215,75,0.8), rgba(10,132,255,0.6)), url('assets/images/fullbody.jpg')"
  };
  hero.style.background = backgrounds[workoutId] || "linear-gradient(135deg, rgba(155,44,255,0.8), rgba(106,60,255,0.6))";
  hero.style.backgroundSize = 'cover';
  hero.style.backgroundPosition = 'center';
  
  let sectionsHTML = '';
  
  // Handle both structures: segments or flat exercises
  if (workout.segments) {
    // New structure with segments
    workout.segments.forEach(segment => {
      sectionsHTML += `<div class="card"><h2>${segment.title}</h2>`;
      if (segment.duration) {
        sectionsHTML += `<p style="margin-bottom: 16px; color: var(--muted);"><small>${segment.duration}</small></p>`;
      }
      segment.exercises.forEach(exercise => {
        sectionsHTML += generateExerciseHTML(exercise, workoutId);
      });
      sectionsHTML += '</div>';
    });
  } else if (workout.exercises) {
    // Old structure with flat exercises grouped by type
    const exercisesByType = {};
    workout.exercises.forEach(exercise => {
      if (!exercisesByType[exercise.type]) {
        exercisesByType[exercise.type] = [];
      }
      exercisesByType[exercise.type].push(exercise);
    });
    
    const sectionTitles = {
      warmup: 'Warm-up',
      main: 'Main Workout',
      core: 'Core Finisher',
      abs: 'Abs Circuit',
      cardio: 'Cardio Session',
      cooldown: 'Cool Down'
    };
    
    Object.keys(exercisesByType).forEach(type => {
      sectionsHTML += `<div class="card"><h2>${sectionTitles[type] || type}</h2>`;
      if (type === 'abs') {
        sectionsHTML += '<p style="margin-bottom: 16px;"><small>Complete 2-3 rounds • Rest 60-90 sec between rounds</small></p>';
      }
      exercisesByType[type].forEach(exercise => {
        sectionsHTML += generateExerciseHTML(exercise, workoutId);
      });
      sectionsHTML += '</div>';
    });
  }
  
  sectionsHTML += `
    <div class="card">
      <div class="workout-complete">
        <button class="start-btn" onclick="markWorkoutComplete('${workoutId}')" style="width: 100%;">
          ✓ Mark Workout Complete
        </button>
      </div>
    </div>`;
  
  hero.insertAdjacentHTML('afterend', sectionsHTML);
  
  // Initialize checkboxes with saved state
  document.querySelectorAll('[data-progress]').forEach(box => {
    const key = box.dataset.progress;
    const workoutType = box.dataset.workout;
    box.checked = loadProgress(key);
    
    box.addEventListener('change', () => {
      saveProgress(key, box.checked);
      box.closest('.exercise-item')?.classList.toggle('done', box.checked);
      if (workoutType) {
        updateWorkoutProgress(workoutType);
      }
    });
    
    if (box.checked) {
      box.closest('.exercise-item')?.classList.add('done');
    }
  });
  
  // Initialize progress on page load
  setTimeout(() => updateWorkoutProgress(workoutId), 100);
}

// Auto-initialize when data is ready
if (workoutData) {
  initWorkoutPage();
} else {
  // Wait for data to load
  setTimeout(initWorkoutPage, 200);
}
</script>
</body>
</html>
